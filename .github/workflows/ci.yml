name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Website Files
        run: |
          echo "Checking website..."
          test -f index.html
          echo "index.html found successfully"

      - name: Build
        run: |
          echo "Building website..."
          mkdir -p build
          cp index.html build/
          echo "Build completed successfully"

      - name: Test
        run: |
          echo "Running tests..."
          test -f build/index.html
          echo "Test passed successfully"

      - name: Generate Logs
        run: |
          echo "CI Pipeline completed successfully"

      - name: Slack Success Notification
        if: success()
        run: |
          curl -X POST \
          -H 'Content-type: application/json' \
          --data '{"text":"✅ CI Pipeline succeeded for devops-webapp"}' \
          "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Slack Failure Notification
        if: failure()
        run: |
          curl -X POST \
          -H 'Content-type: application/json' \
          --data '{"text":"❌ CI Pipeline failed for devops-webapp"}' \
          "${{ secrets.SLACK_WEBHOOK_URL }}"